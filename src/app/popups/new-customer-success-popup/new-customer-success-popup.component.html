<div class="popup-card">
    <div class="popup-success-icon">
        <i class="fa-solid fa-check"></i>
    </div>

    <div class="popup-title-group">
        <h2>Success</h2>
        <p>New customer added successfully</p>
    </div>

    <div class="popup-summary">
        <div class="summary-row">
            <span class="summary-label">Project Name</span>
            <span class="summary-value">{{ data.customer.display_name }}</span>
        </div>
        <div class="summary-row">
            <span class="summary-label">Tel</span>
            <span class="summary-value">{{ data.contact.tel }}</span>
        </div>
        <div class="summary-row">
            <span class="summary-label">Project Location</span>
            <span class="summary-value">{{ data.customer.project_location_name }}</span>
        </div>
        <div class="summary-row">
            <span class="summary-label">Customer ID</span>
            <span class="summary-value">{{ data.customer.id }}</span>
        </div>
    </div>

    <div class="popup-actions">
        <button class="k-btn k-btn-primary" (click)="openDetailPopup()">OPEN DETAIL</button>
        <button class="k-btn k-btn-outline">OK</button>
    </div>
</div>
